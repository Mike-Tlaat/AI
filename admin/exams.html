<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>قائمة الامتحانات</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body data-require-admin="true">
    <header class="topbar">
      <div class="container topbar-inner">
        <div>
          <h1><i class="fa-solid fa-folder-open"></i> الامتحانات الحالية</h1>
          <div class="sub">عرض الامتحانات المنشورة وإدارتها بسرعة</div>
        </div>
        <div class="topbar-chip">
          <i class="fa-solid fa-lock"></i>
          <span>Admin Panel</span>
        </div>
      </div>
    </header>

    <main class="admin-shell">
      <div class="admin-toolbar">
        <nav class="admin-nav" aria-label="تنقل لوحة التحكم">
          <a class="btn btn-primary btn-sm" href="exams.html">
            <i class="fa-solid fa-list-check"></i> الامتحانات
          </a>
          <a class="btn btn-outline btn-sm" href="builder.html">
            <i class="fa-solid fa-plus-circle"></i> إضافة وتعديل
          </a>
          <a class="btn btn-outline btn-sm" href="results-pass.html">
            <i class="fa-solid fa-circle-check"></i> الناجحون
          </a>
          <a class="btn btn-outline btn-sm" href="results-fail.html">
            <i class="fa-solid fa-circle-xmark"></i> غير الناجحين
          </a>
        </nav>
        <button type="button" class="btn btn-outline btn-sm" data-admin-logout>
          <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </button>
      </div>

      <section class="card">
        <div class="section-title">
          <span class="dot"></span>
          <h2>قائمة الامتحانات</h2>
        </div>
        <div id="examsList" class="muted">
          <i class="fa-solid fa-spinner fa-spin"></i> جارِ تحميل البيانات...
        </div>
      </section>
    </main>

    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/grading.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
