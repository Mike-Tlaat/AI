<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>غير الناجحين</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body data-require-admin="true">
    <header class="topbar">
      <div class="container topbar-inner">
        <div>
          <h1><i class="fa-solid fa-circle-xmark"></i> غير الناجحين</h1>
          <div class="sub">قائمة الطلاب الذين لم يتجاوزوا نسبة النجاح</div>
        </div>
        <div class="topbar-chip">
          <i class="fa-solid fa-lock"></i>
          <span>Admin Panel</span>
        </div>
      </div>
    </header>

    <main class="admin-shell">
      <div class="admin-toolbar">
        <nav class="admin-nav" aria-label="تنقل لوحة التحكم">
          <a class="btn btn-outline btn-sm" href="exams.html">
            <i class="fa-solid fa-list-check"></i> الامتحانات
          </a>
          <a class="btn btn-outline btn-sm" href="builder.html">
            <i class="fa-solid fa-plus-circle"></i> إضافة وتعديل
          </a>
          <a class="btn btn-outline btn-sm" href="results-pass.html">
            <i class="fa-solid fa-circle-check"></i> الناجحون
          </a>
          <a class="btn btn-primary btn-sm" href="results-fail.html">
            <i class="fa-solid fa-circle-xmark"></i> غير الناجحين
          </a>
        </nav>
        <button type="button" class="btn btn-outline btn-sm" data-admin-logout>
          <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
        </button>
      </div>

      <section class="card">
        <div class="row">
          <div class="field">
            <label for="resultsExamFilter">تصفية حسب الامتحان</label>
            <select id="resultsExamFilter" onchange="loadResults()">
              <option value="">كل الامتحانات</option>
            </select>
          </div>
          <div class="field">
            <label for="resultsSearch">البحث عن طالب</label>
            <input
              type="text"
              id="resultsSearch"
              placeholder="ابحث بالاسم أو رقم الهاتف..."
            />
          </div>
          <div class="field" style="max-width: 220px">
            <label for="showAnswersToggle">تفاصيل الإجابات</label>
            <select id="showAnswersToggle" onchange="renderResultsTables()">
              <option value="hide">إخفاء تفاصيل الإجابات</option>
              <option value="show">إظهار الإجابات المفصلة</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card" id="failResultsCard">
        <div class="section-title">
          <span class="dot danger-dot"></span>
          <h2>الطلاب غير الناجحين (<span id="failCount">0</span>)</h2>
        </div>
        <div id="failTable" class="muted">
          <i class="fa-solid fa-spinner fa-spin"></i> جاري جلب السجلات...
        </div>
      </section>
    </main>

    <div id="toastHost"></div>

    <script src="../assets/js/supabase-client.js"></script>
    <script src="../assets/js/grading.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/admin-results.js"></script>
  </body>
</html>
