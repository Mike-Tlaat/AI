<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة التحكم — إدارة الامتحانات</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <!-- الهيدر العلوي -->
    <header class="topbar">
      <div class="container topbar-inner">
        <div>
          <h1><i class="fa-solid fa-sliders"></i> لوحة التحكم</h1>
          <div class="sub">إدارة الامتحانات، الأسئلة، ومتابعة النتائج</div>
        </div>
        <div class="topbar-chip">
          <i class="fa-solid fa-sparkles"></i>
          <span>Developed by Mike Talaat</span>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- التبويبات الرئيسية -->
      <nav class="tabs" aria-label="أقسام لوحة التحكم">
        <button class="tab-btn active" data-tab="exams">
          <i class="fa-solid fa-list-check"></i> الامتحانات
        </button>
        <button class="tab-btn" data-tab="builder">
          <i class="fa-solid fa-plus-circle"></i> إنشاء امتحان جديد
        </button>
        <button class="tab-btn" data-tab="results">
          <i class="fa-solid fa-chart-line"></i> النتائج والتقارير
        </button>
      </nav>

      <!-- ============ TAB: EXAMS LIST ============ -->
      <section id="tab-exams" class="tab-panel">
        <div class="card">
          <div class="section-title">
            <span class="dot"></span>
            <h2><i class="fa-solid fa-folder-open"></i> قائمة الامتحانات M</h2>
          </div>
          <div id="examsList" class="muted">
            <i class="fa-solid fa-spinner fa-spin"></i> جارِ تحميل البيانات...
          </div>
        </div>
      </section>

      <!-- ============ TAB: BUILDER ============ -->
      <section id="tab-builder" class="tab-panel hidden">
        <div class="card">
          <div class="section-title">
            <span class="dot"></span>
            <h2><i class="fa-solid fa-gear"></i> إعدادات الامتحان</h2>
          </div>
          <div class="row">
            <div class="field">
              <label for="examTitle">عنوان الامتحان</label>
              <input
                type="text"
                id="examTitle"
                placeholder="مثال: اختبار منتصف الفصل - اللغة العربية"
                autocomplete="off"
              />
            </div>
            <div class="field">
              <label for="examDuration">المدة الزمنية (بالدقائق)</label>
              <input type="number" id="examDuration" min="1" value="30" />
            </div>
            <div class="field">
              <label for="examPassPct">نسبة النجاح المطلوب (%)</label>
              <input
                type="number"
                id="examPassPct"
                min="1"
                max="100"
                value="50"
              />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="examAutoShow">عرض النتيجة للطالب</label>
              <select id="examAutoShow">
                <option value="true">تلقائيًا بعد تسليم الامتحان مباشرة</option>
                <option value="false">
                  لاحقًا فقط (عبر صفحة الاستعلام بالرقم)
                </option>
              </select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="flex-between wrap-mobile">
            <div class="section-title" style="margin-bottom: 0">
              <span class="dot"></span>
              <h2><i class="fa-solid fa-layer-group"></i> بنك الأسئلة</h2>
            </div>
            <div class="btn-group">
              <button
                type="button"
                class="btn btn-outline btn-sm"
                onclick="addQuestion('true_false')"
              >
                <i class="fa-solid fa-check-double"></i> صح / خطأ
              </button>
              <button
                type="button"
                class="btn btn-outline btn-sm"
                onclick="addQuestion('mcq')"
              >
                <i class="fa-solid fa-list-ul"></i> اختيار من متعدد
              </button>
              <button
                type="button"
                class="btn btn-outline btn-sm"
                onclick="addQuestion('fill')"
              >
                <i class="fa-solid fa-pen-to-square"></i> أكمل الجملة
              </button>
            </div>
          </div>

          <div id="questionsBuilder" class="mt-16"></div>

          <div id="noQuestionsMsg" class="empty-state">
            <i class="fa-solid fa-file-circle-plus empty-icon"></i>
            <p>
              لم تقم بإضافة أسئلة بعد. اختر نوع السؤال من الأزرار أعلاه للبدء.
            </p>
          </div>
        </div>

        <div class="flex-between">
          <span class="muted" id="builderStatus"></span>
          <button
            type="button"
            class="btn btn-primary btn-lg"
            id="saveExamBtn"
            onclick="saveExam()"
          >
            <i class="fa-solid fa-floppy-disk"></i> حفظ ونشر الامتحان
          </button>
        </div>
      </section>

      <!-- ============ TAB: RESULTS ============ -->
      <section id="tab-results" class="tab-panel hidden">
        <div class="card">
          <div class="row">
            <div class="field">
              <label for="resultsExamFilter">تصفية حسب الامتحان</label>
              <select id="resultsExamFilter" onchange="loadResults()">
                <option value="">جميع الامتحانات</option>
              </select>
            </div>
            <div class="field">
              <label for="resultsSearch">البحث عن طالب</label>
              <input
                type="text"
                id="resultsSearch"
                placeholder="ابحث بالاسم أو رقم الهاتف..."
              />
            </div>
            <div class="field" style="max-width: 220px">
              <label for="showAnswersToggle">تفاصيل الإجابات</label>
              <select id="showAnswersToggle" onchange="renderResultsTables()">
                <option value="hide">إخفاء تفاصيل الإجابات</option>
                <option value="show">إظهار الإجابات المفصلة</option>
              </select>
            </div>
          </div>

          <div class="result-filter-row">
            <button
              type="button"
              class="btn btn-outline btn-sm active"
              data-result-filter="all"
              onclick="setResultsView('all')"
            >
              <i class="fa-solid fa-users"></i> جميع الطلاب
            </button>
            <button
              type="button"
              class="btn btn-outline btn-sm"
              data-result-filter="pass"
              onclick="setResultsView('pass')"
            >
              <i class="fa-solid fa-circle-check"></i> الناجحون
            </button>
            <button
              type="button"
              class="btn btn-outline btn-sm"
              data-result-filter="fail"
              onclick="setResultsView('fail')"
            >
              <i class="fa-solid fa-circle-xmark"></i> غير الناجحين
            </button>
          </div>
        </div>

        <div class="card" id="passResultsCard">
          <div class="section-title">
            <span class="dot success-dot"></span>
            <button
              type="button"
              class="section-action"
              onclick="setResultsView('pass')"
            >
              الطلاب الناجحون (<span id="passCount">0</span>)
            </button>
          </div>
          <div id="passTable" class="muted">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري جلب السجلات...
          </div>
        </div>

        <div class="card" id="failResultsCard">
          <div class="section-title">
            <span class="dot danger-dot"></span>
            <button
              type="button"
              class="section-action"
              onclick="setResultsView('fail')"
            >
              الطلاب غير الناجحين (<span id="failCount">0</span>)
            </button>
          </div>
          <div id="failTable" class="muted">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري جلب السجلات...
          </div>
        </div>
      </section>
    </main>

    <div id="toastHost"></div>

    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/grading.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/admin-results.js"></script>
  </body>
</html>
