<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الاستعلام عن النتيجة</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="center-screen">
      <div class="card message-card" style="max-width: 440px">
        <h2>الاستعلام عن نتيجة الامتحان</h2>
        <p class="muted mt-8" id="examTitleLabel">
          اكتب رقم الهاتف الذي امتحنت به لعرض نتيجتك
        </p>

        <div class="mt-16" style="text-align: right">
          <div class="field">
            <label>رقم الهاتف</label>
            <input type="tel" id="lookupPhone" placeholder="اكتب رقم هاتفك" />
          </div>
          <button class="btn btn-primary btn-block" onclick="lookupResult()">
            عرض النتيجة
          </button>
          <div
            id="lookupError"
            class="muted mt-8"
            style="color: var(--danger)"
          ></div>
        </div>

        <div id="lookupResultBox" class="hidden mt-24">
          <div class="result-hero" style="padding: 10px 0">
            <div class="result-percentage" id="lookupPct">0%</div>
            <div class="result-grade" id="lookupGrade"></div>
            <p class="muted mt-16" id="lookupDetail"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="toastHost"></div>

    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/grading.js"></script>
    <script src="assets/js/results.js"></script>
  </body>
</html>
